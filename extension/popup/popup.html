<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Domain Saver</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <div class="logo">
        <img src="../icons/icon.jpg" alt="Logo" class="logo-img">
        <span>Auto Domain Saver</span>
      </div>
      <span class="badge">Option B</span>
    </div>

    <div class="domain-card" id="domainCard">
      <div class="status-badge" id="statusBadge">
        <span class="status-dot green"></span>
        <span id="domainText">Detecting domain...</span>
      </div>
      <p class="status-subtitle" id="statusSub">This domain will be saved automatically (if not already saved).</p>
      
      <div class="details-box" id="detailsBox">
        <div class="domain-title" id="domainTitle">github.com</div>
        <div class="domain-status-msg" id="domainStatusMsg">Already saved ✓</div>
      </div>
    </div>

    <div class="settings-row">
      <span>Auto Save Enabled</span>
      <label class="switch">
        <input type="checkbox" id="toggleAutoSave" checked>
        <span class="slider round"></span>
      </label>
    </div>

    <button id="openDashboardBtn" class="dashboard-btn">
      <span>Open Web Dashboard</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
